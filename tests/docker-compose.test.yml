# Test infrastructure for integration tests.
#
# Services:
#   minio    — S3-compatible object store (port 9000)
#   registry — registry:3 backed by MinIO (port 5001)
#
# REGISTRY_STORAGE_REDIRECT_DISABLE=true is set on the registry so that blob
# HEAD/GET requests are served directly by the registry rather than being
# redirected to http://minio:9000/...  Without this, tests running on the host
# follow the redirect to a hostname that is only resolvable inside Docker.
#
# Usage:
#   docker compose -f tests/docker-compose.test.yml up -d --wait
#   REGISTRY_INTEGRATION_TEST=1 cargo test --test gc_integration -- --nocapture
#   REGISTRY_INTEGRATION_TEST=1 cargo test --test migrate_integration -- --nocapture
#   docker compose -f tests/docker-compose.test.yml down -v

services:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/registry &&
        echo 'Bucket ready.'
      "

  registry:
    image: registry:3
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "5001:5000"
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_ACCESSKEY: minioadmin
      REGISTRY_STORAGE_S3_SECRETKEY: minioadmin
      REGISTRY_STORAGE_S3_BUCKET: registry
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://minio:9000
      REGISTRY_STORAGE_S3_REGION: us-east-1
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_REDIRECT_DISABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/v2/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
