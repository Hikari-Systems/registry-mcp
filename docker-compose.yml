services:
  registry-mcp:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ../../configs/registry-mcp:/sandbox
      # Mount Docker socket only if using Docker GC strategy:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/app/registry-mcp", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
