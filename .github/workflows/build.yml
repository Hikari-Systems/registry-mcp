name: Build and push to GHCR

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNNER_MAP || '{}')[matrix.runner] || (contains(matrix.runner, 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    timeout-minutes: 40
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: linux-x64-build
          - platform: arm64
            runner: linux-arm64-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # The layer cache follows the runner (see hikari-systems/hs-ci-actions).
      - name: Build and push by digest
        uses: hikari-systems/hs-ci-actions/docker-build@v1
        with:
          image: ghcr.io/hikari-systems/${{ github.event.repository.name }}
          platform: ${{ matrix.platform }}
          cache: ${{ fromJSON(vars.RUNNER_MAP || '{}')['_cache'][matrix.runner] || 'auto' }}
          registry-token: ${{ secrets.GH_TOKEN }}
          s3-bucket: hikari-docker-registry
          s3-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          registry-http-secret: ${{ secrets.DOCKER_REGISTRY_SECRET }}

  merge-manifest:
    runs-on: ${{ fromJSON(vars.RUNNER_MAP || '{}')['linux-any-light'] || 'ubuntu-latest' }}
    timeout-minutes: 10
    needs: build
    steps:
      - name: Merge the platform digests and tag the image
        uses: hikari-systems/hs-ci-actions/merge-manifest@v1
        with:
          image: ghcr.io/hikari-systems/${{ github.event.repository.name }}
          registry-token: ${{ secrets.GH_TOKEN }}
          s3-bucket: hikari-docker-registry
          s3-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          registry-http-secret: ${{ secrets.DOCKER_REGISTRY_SECRET }}
          # Only the deploy branches are copied into the S3-backed registry.
          save-to-s3-registry: ${{ github.ref_name == 'main' || github.ref_name == 'preview' }}

      - name: Install skopeo
        if: github.ref == 'refs/heads/main'
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/skopeo-auth.json" >> "$GITHUB_ENV"
          echo "REPO_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Log in to Docker Hub via skopeo
        if: github.ref == 'refs/heads/main'
        run: |
          skopeo login index.docker.io \
            --username ${{ secrets.DOCKERHUB_USERNAME }} \
            --password ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy multi-arch manifest to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          for TAG in ${{ github.sha }} latest; do
            skopeo copy \
              --all \
              docker://ghcr.io/hikari-systems/${{ env.REPO_NAME }}:${TAG} \
              docker://hikarisystems/${{ env.REPO_NAME }}:${TAG}
          done
